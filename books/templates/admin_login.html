{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login — BÓokly Editorial Portal</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 30%, #F4ECE1 0%, #EAE0D3 100%);
            padding: 20px;
        }

        .login-card {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(35, 20, 10, 0.1);
            max-width: 440px;
            width: 100%;
            padding: 40px;
            position: relative;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <!-- Logo & Header -->
        <div class="text-center mb-4">
            <div class="brand-logo-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 24px;">
                📖
            </div>
            <h3 class="font-serif fw-bold mb-1">BÓokly Portal</h3>
            <p class="text-muted small">Sign in to manage catalog volumes and literary collections.</p>
        </div>

        <!-- Feedback Messages -->
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} py-2 px-3 small d-flex align-items-center gap-2 mb-3"
            role="alert">
            <span>ℹ</span>
            <div>{{ message }}</div>
        </div>
        {% endfor %}
        {% endif %}

        <!-- Login Form -->
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Staff Username</label>
                <div class="position-relative">
                    <input type="text" name="username" class="form-control" placeholder="Enter your username"
                        style="border-radius: 10px; font-size: 14px; padding: 10px 14px;" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label small fw-bold text-muted mb-0">Password</label>
                </div>
                <input type="password" name="password" class="form-control" placeholder="••••••••••••"
                    style="border-radius: 10px; font-size: 14px; padding: 10px 14px;" required>
            </div>

            <button type="submit" class="btn btn-editorial-primary w-100 py-2 justify-content-center mb-3"
                style="font-size: 15px;">
                Enter Management Dashboard →
            </button>

            <div class="text-center pt-2 border-top">
                <a href="{% url 'home' %}" class="small text-muted text-decoration-none">
                    ← Return to Public Library
                </a>
            </div>
        </form>
    </div>

</body>

</html>
